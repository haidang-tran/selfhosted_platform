version: '3.8'

services:
  # 1. Cơ sở dữ liệu Production (cách ly hoàn toàn trên prod-net)
  mysql:
    image: mysql:8.0
    container_name: prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prod_root_pass_ultra_secure_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_production}
      MYSQL_USER: ${MYSQL_USER:-app_prod_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prod_user_pass_ultra_secure_2026}
    volumes:
      - prod-mysql-data:/var/lib/mysql
    networks:
      - prod-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-prod_root_pass_ultra_secure_2026}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 2. Frontend Web App Production
  frontend:
    image: ghcr.io/haidang-tran/selfhosted-platform/frontend:${GHCR_IMAGE_TAG:-production}
    container_name: prod-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      - prod-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 3. API Service Production
  api:
    image: nginx:alpine
    container_name: prod-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8081}:80"
    volumes:
      - ./api-mock:/usr/share/nginx/html:ro
    networks:
      - prod-net
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  prod-mysql-data:
    name: prod-mysql-data

networks:
  prod-net:
    external: true
