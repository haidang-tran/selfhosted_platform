global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # 1. Tự giám sát Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Giám sát tài nguyên máy chủ Host (CPU, RAM, Disk, Network)
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  # 3. Giám sát chi tiết từng Container qua cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # 4. Kiểm tra độ sống của website Production & Staging
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://172.17.0.1:8080   # Production Frontend
          - http://172.17.0.1:9080   # Staging Frontend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
